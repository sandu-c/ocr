name: Publish to npm

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v3
        with:
          lfs: true
      
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
          registry-url: 'https://registry.npmjs.org'
      
      - name: Install dependencies
        run: npm install
      
      - name: Publish packages
        run: |
          cd packages/models && npm publish --access public --provenance
          cd ../common && npm publish --access public --provenance
          cd ../browser && npm publish --access public --provenance --ignore-scripts
          cd ../node && npm publish --access public --provenance --ignore-scripts
