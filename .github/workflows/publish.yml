name: Publish to npm

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          registry-url: 'https://registry.npmjs.org'
      
      - uses: oven-sh/setup-bun@v2
      
      - name: Install dependencies
        run: bun install
      
      - name: Build packages
        run: |
          cd packages/common && rm -rf build && bun run tsc --project tsconfig.build.json --skipLibCheck && bun run tsc-alias --project tsconfig.build.json
          cd ../browser && rm -rf build && bun run tsc --project tsconfig.build.json --skipLibCheck && bun run tsc-alias --project tsconfig.build.json
          cd ../node && rm -rf build && bun run tsc --project tsconfig.build.json --skipLibCheck && bun run tsc-alias --project tsconfig.build.json
      
      - name: Publish packages
        run: |
          cd packages/models && cp ../../README.md . && npm publish --access public --provenance
          cd ../common && cp ../../README.md . && npm publish --access public --provenance --ignore-scripts
          cd ../browser && cp ../../README.md . && npm publish --access public --provenance --ignore-scripts
          cd ../node && cp ../../README.md . && npm publish --access public --provenance --ignore-scripts
